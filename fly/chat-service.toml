# Chat Service — gRPC (private networking only, not exposed publicly)
app = 'ai-char-chat'
primary_region = 'nrt'

[build]
  dockerfile = '../Dockerfile'
  [build.args]
    SERVICE = 'chat-service'

[env]
  NODE_ENV         = 'production'
  CHAT_SERVICE_URL = '0.0.0.0:50051'
  DB_TYPE          = 'postgres'

# Secrets: GEMINI_API_KEY, ANTHROPIC_API_KEY, DATABASE_URL, REDIS_HOST, REDIS_PORT

# gRPC는 Fly private network으로만 접근 (공개 포트 없음)
[[services]]
  protocol      = 'tcp'
  internal_port = 50051

  # 공개 포트 없음 — Fly private networking (*.internal) 으로만 접근
  # api-gateway에서 ai-char-chat.internal:50051 로 접근

[checks]
  [checks.alive]
    type     = 'tcp'
    port     = 50051
    interval = '15s'
    timeout  = '5s'

[vm]
  size   = 'shared-cpu-1x'
  memory = '256mb'
